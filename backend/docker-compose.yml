version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: habitime-postgres
    restart: always
    environment:
      POSTGRES_USER: habitime
      POSTGRES_PASSWORD: habitime_pass
      POSTGRES_DB: habitime_db
    ports:
      - "5432:5432"
    volumes:
      - habitime_pgdata:/var/lib/postgresql/data

volumes:
  habitime_pgdata:
